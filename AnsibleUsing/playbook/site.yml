---
- name: Install and configure ClickHouse
  hosts: clickhouse
  become: true

  roles:
    - clickhouse-role

- name: Install and configure Vector
  hosts: vector
  become: true

  vars:
    # Vector ships host metrics into the ClickHouse host from the inventory,
    # regardless of its current IP (resolved dynamically from hostvars).
    vector_sinks:
      clickhouse:
        type: clickhouse
        inputs:
          - host_metrics
        endpoint: "http://{{ hostvars[groups['clickhouse'][0]].ansible_host }}:{{ clickhouse_http_port | default(8123) }}"
        database: default
        table: vector_metrics
        skip_unknown_fields: true

  roles:
    - vector-role

- name: Install and configure LightHouse dashboard
  hosts: lighthouse
  become: true

  roles:
    - lighthouse-role

  tasks:
    - name: Verify LightHouse responds over HTTP
      ansible.builtin.uri:
        url: "http://localhost:{{ lighthouse_nginx_port }}/"
        status_code: 200
      tags:
        - healthcheck
